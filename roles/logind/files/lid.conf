[Login]
# Lid closed: lock the session (machine keeps running), BUT stay fully active
# and unlocked when an external display is connected (the RayNeo glasses or a
# monitor). systemd treats "more than one display connected" as docked, so
# HandleLidSwitchDocked covers the glasses.
# NB: not "suspend" -- this hardware (Asahi) does not resume reliably from
# suspend, so lid-close locks instead of sleeping.
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=ignore

# Power button: short press locks the session (hypridle catches the lock
# signal and launches hyprlock). Long press powers the machine off.
HandlePowerKey=lock
HandlePowerKeyLongPress=poweroff
