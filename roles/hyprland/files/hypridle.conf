general {
    # Triggered by `loginctl lock-session` — which is exactly what
    # systemd-logind emits on a short power-button press (HandlePowerKey=lock).
    #
    # Caelestia's lock screen is part of the quickshell process, so it matches
    # the Material You scheme derived from the wallpaper. It cannot lock if the
    # shell is not running, hence the hyprlock fallback: never fail to lock.
    lock_cmd = caelestia shell lock lock || { pidof hyprlock || hyprlock; }

    # Also lock before the machine suspends, and restore the display after.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# No [listener] idle-timeout blocks: locking is power-button-driven only,
# the screen never locks itself on idle.
