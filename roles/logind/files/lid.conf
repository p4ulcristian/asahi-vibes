[Login]
# Lid closed: suspend (s2idle). Earlier Asahi kernels never resumed -- the
# display (apple-dcp) stayed black and forced a hard power-off, so this was
# `ignore` for a long time. Re-enabled 2026-07-03 at Paul's request; if resume
# regresses after a kernel update, flip these back to `ignore`.
# `Docked` stays `ignore` so clamshell use with an external display (RayNeo
# glasses / TV) keeps working with the lid shut.
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# Power button: short press locks the session (hypridle catches the lock
# signal and launches hyprlock). Long press powers the machine off.
HandlePowerKey=lock
HandlePowerKeyLongPress=poweroff
