[Login]
# Lid closed: do NOTHING. The machine keeps running with the lid shut.
#
# Why not suspend or lock: on this Apple Silicon / Asahi hardware the display
# (apple-dcp) does not reliably come back after a lid close/open cycle -- both
# `suspend` (never resumes) and `lock` (drops to a black screen / SDDM) left
# the machine unrecoverable, forcing a hard power-off. Leaving the lid as
# `ignore` is the known-good behaviour. Locking is handled by the power button
# and Super+Shift+L instead, neither of which cycles the lid/display.
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore

# Power button: short press locks the session (hypridle catches the lock
# signal and launches hyprlock). Long press powers the machine off.
HandlePowerKey=lock
HandlePowerKeyLongPress=poweroff
