---
# Caelestia — a Quickshell-based desktop shell. It replaces four things we used
# to run separately: waybar (bar), mako (notifications), rofi/vicinae
# (launcher) and awww (wallpaper + the colour scheme derived from it).
#
# Two AUR build notes, both specific to this aarch64 box:
#
#   * libcava and python-materialyoucolor declare arch=('x86_64'), but the code
#     is portable (meson/C and pybind11/C++ respectively) and builds clean on
#     aarch64. The arch field is untested, not a real constraint -> --ignorearch.
#
#   * python-materialyoucolor additionally needs CXX overridden. Arch Linux ARM
#     builds its python package with distcc, and that leaked into sysconfig:
#     CXX still points at /usr/lib/distcc/bin/g++, which does not exist here, so
#     any Python C++ extension build dies with ENOENT. Note that BUILDENV in
#     /etc/makepkg.conf already has !distcc — that is NOT the cause and changing
#     it does not help; the path comes from python itself.

- name: Install caelestia AUR dependencies
  become: false
  environment:
    CC: gcc
    CXX: g++
  shell: yay -S --noconfirm --needed --mflags="--ignorearch" {{ item }}
  loop:
    - libcava
    - python-materialyoucolor
    - ttf-rubik-vf
    - quickshell-git
  register: caelestia_deps
  changed_when: "'there is nothing to do' not in caelestia_deps.stdout"

- name: Install caelestia shell and cli
  become: false
  environment:
    CC: gcc
    CXX: g++
  shell: yay -S --noconfirm --needed --mflags="--ignorearch" {{ item }}
  loop:
    - caelestia-cli
    - caelestia-shell
  register: caelestia_pkgs
  changed_when: "'there is nothing to do' not in caelestia_pkgs.stdout"

# ---------------------------------------------------------------------------
# Retire what caelestia replaces.
#
# Stop the user services first: removing a package does not stop an already
# running unit, and a stale waybar would keep drawing a second bar until the
# next reboot. failed_when guards the case where the unit is already gone (a
# re-run, or a machine that never had it).
# ---------------------------------------------------------------------------

- name: Stop and disable superseded user services
  become: false
  systemd:
    scope: user
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - waybar.service
    - mako.service
    - vicinae.service
  register: retired_units
  failed_when: false

- name: Remove superseded packages
  become: true
  community.general.pacman:
    name:
      - waybar
      - mako
      - rofi
      - vicinae
      - awww
      - networkmanager-dmenu-git
      # waybar drew its glyphs with these; caelestia ships its own fonts
      # (ttf-material-symbols-variable, ttf-rubik-vf, ttf-cascadia-code-nerd).
      # kitty and powerlevel10k both use ttf-jetbrains-mono-nerd, which stays.
      - powerline-fonts
      - otf-font-awesome
    state: absent

- name: Remove superseded config directories
  become: false
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/{{ item }}"
    state: absent
  loop:
    - waybar
    - mako
    - vicinae
    - rofi

- name: Remove the waybar systemd drop-in
  become: false
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/systemd/user/waybar.service.d"
    state: absent

- name: Remove the per-workspace wallpaper daemon (caelestia owns the wallpaper now)
  become: false
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/hypr/workspace-wallpaper.py"
    state: absent

- name: Reload the systemd user daemon
  become: false
  systemd:
    scope: user
    daemon_reload: true

# ---------------------------------------------------------------------------
# Shell configuration and wallpaper.
#
# Caelestia derives its entire Material You palette from the wallpaper, so the
# wallpaper is a real config input here, not decoration.
# ---------------------------------------------------------------------------

- name: Create caelestia config dir
  become: false
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/caelestia"
    state: directory

# Without services.weatherLocation the shell geolocates by IP (ip-api.com),
# which resolves to the ISP's city rather than ours.
- name: Deploy caelestia shell config
  become: false
  copy:
    src: shell.json
    dest: "{{ lookup('env', 'HOME') }}/.config/caelestia/shell.json"
    backup: yes

- name: Create wallpaper dir
  become: false
  file:
    path: "{{ lookup('env', 'HOME') }}/media/pictures/wallpapers"
    state: directory

- name: Download Everforest wallpapers
  become: false
  get_url:
    url: "https://raw.githubusercontent.com/Apeiros-46B/everforest-walls/main/{{ item.src }}"
    dest: "{{ lookup('env', 'HOME') }}/media/pictures/wallpapers/{{ item.name }}.png"
    mode: "0644"
  loop:
    - { name: green-forest,     src: "nature/green_forest_1.png" }
    - { name: fog-forest,       src: "nature/fog_forest_1.png" }
    - { name: foggy-valley,     src: "nature/foggy_valley_1.png" }
    - { name: mist-forest,      src: "nature/mist_forest_1.png" }
    - { name: waterfall,        src: "nature/waterfall_1.png" }
    - { name: ocean-front,      src: "nature/ocean_front_1.png" }
    - { name: rocky-beach,      src: "nature/rocky_beach_1.png" }
    - { name: megacity,         src: "other/megacity_1.png" }
    - { name: futuristic-green, src: "other/futuristic_green.png" }
    - { name: polyscape,        src: "nature/polyscape_1.png" }

# Only fires while the shell is running (it is an IPC call). If caelestia is
# not up yet — first provision, before the Hyprland session starts — this is a
# no-op and the wallpaper gets set on the next run.
- name: Check the current wallpaper
  become: false
  command: caelestia shell wallpaper get
  register: current_wallpaper
  changed_when: false
  failed_when: false

- name: Set the wallpaper if it is still the packaged default
  become: false
  command: >-
    caelestia wallpaper -f {{ lookup('env', 'HOME') }}/media/pictures/wallpapers/foggy-valley.png
  when:
    - current_wallpaper.rc == 0
    - "'/etc/xdg/quickshell' in current_wallpaper.stdout"

# Caelestia reads the profile picture from ~/.face and shows it on the
# dashboard and lock screen; with no such file the avatar is simply blank.
# force: no seeds a default without clobbering a picture chosen later through
# the dashboard's picker, which writes to this same path.
- name: Seed a default profile picture
  become: false
  copy:
    src: face.png
    dest: "{{ lookup('env', 'HOME') }}/.face"
    mode: "0644"
    force: no

# ---------------------------------------------------------------------------
# GTK base theme.
#
# Caelestia only emits colours: gtk.css is a list of @define-color overrides.
# Those names (accent_color, window_bg_color, view_bg_color, ...) are exactly
# libadwaita's documented override variables, so GTK4 apps recolour correctly
# on their own. GTK3 has no such mechanism -- it needs a real theme underneath
# for the colours to land on, and adw-gtk3-dark is the one caelestia's Thunar
# stylesheet is written against.
#
# The dconf keys are the part that is easy to get wrong: setting gtk-theme to
# a theme that is not installed fails silently, falling back to built-in
# Adwaita (light), which is what made the dark caelestia colours look broken.
# The packages role installs adw-gtk-theme and papirus-icon-theme so both
# names below resolve.
# ---------------------------------------------------------------------------

- name: Set the GTK theme, icon theme and colour scheme
  become: false
  community.general.dconf:
    key: "/org/gnome/desktop/interface/{{ item.key }}"
    value: "'{{ item.value }}'"
    state: present
  loop:
    - { key: gtk-theme,    value: adw-gtk3-dark }
    - { key: icon-theme,   value: Papirus-Dark }
    - { key: color-scheme, value: prefer-dark }

# Belt and braces for GTK3 apps that read settings.ini directly rather than
# going through xdg-desktop-portal-gtk / dconf. Caelestia never writes this
# file (its templates only produce gtk.css), so there is nothing to clobber.
- name: Configure GTK3 settings.ini
  become: false
  copy:
    dest: "{{ lookup('env', 'HOME') }}/.config/gtk-3.0/settings.ini"
    mode: "0644"
    content: |
      [Settings]
      gtk-theme-name=adw-gtk3-dark
      gtk-icon-theme-name=Papirus-Dark
      gtk-application-prefer-dark-theme=1
