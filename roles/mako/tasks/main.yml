---
# Desktop notification daemon (org.freedesktop.Notifications). Required for
# screenshot/recording popups and any app notification. The `mako` package is
# installed by the `packages` role.
- name: Create mako config dir
  become: false
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/mako"
    state: directory

- name: Deploy mako config
  become: false
  copy:
    src: config
    dest: "{{ lookup('env', 'HOME') }}/.config/mako/config"
    backup: yes

- name: Unmask, enable and start mako user service
  become: false
  systemd:
    scope: user
    name: mako.service
    masked: false
    enabled: true
    state: started
