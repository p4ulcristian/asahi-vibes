---
- name: Create hyprland config dir
  become: false
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/hypr"
    state: directory

- name: Deploy hyprland lua config
  become: false
  template:
    src: hyprland.lua.j2
    dest: "{{ lookup('env', 'HOME') }}/.config/hypr/hyprland.lua"
    backup: yes

- name: Deploy hypridle config (catches the power-button lock signal)
  become: false
  copy:
    src: hypridle.conf
    dest: "{{ lookup('env', 'HOME') }}/.config/hypr/hypridle.conf"

- name: Deploy hyprlock config (the lock screen)
  become: false
  copy:
    src: hyprlock.conf
    dest: "{{ lookup('env', 'HOME') }}/.config/hypr/hyprlock.conf"
