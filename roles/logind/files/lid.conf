[Login]
# Lid closed: suspend normally, BUT stay running when an external display is
# connected (the RayNeo glasses or a monitor). systemd treats "more than one
# display connected" as docked, so HandleLidSwitchDocked covers the glasses.
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# Power button: short press locks the session (hypridle catches the lock
# signal and launches hyprlock). Long press powers the machine off.
HandlePowerKey=lock
HandlePowerKeyLongPress=poweroff
