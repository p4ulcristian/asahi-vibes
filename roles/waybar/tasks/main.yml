---
- name: Create waybar config dir
  become: false
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/waybar"
    state: directory

- name: Deploy waybar config
  become: false
  copy:
    src: config
    dest: "{{ lookup('env', 'HOME') }}/.config/waybar/config"
    backup: yes

- name: Deploy waybar style
  become: false
  copy:
    src: style.css
    dest: "{{ lookup('env', 'HOME') }}/.config/waybar/style.css"
    backup: yes

- name: Create local bin dir
  become: false
  file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin"
    state: directory

- name: Deploy bt-battery helper script
  become: false
  copy:
    src: bt-battery
    dest: "{{ lookup('env', 'HOME') }}/.local/bin/bt-battery"
    mode: "0755"

- name: Create waybar.service systemd drop-in dir
  become: false
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/systemd/user/waybar.service.d"
    state: directory

- name: Deploy waybar.service restart drop-in
  become: false
  copy:
    src: override.conf
    dest: "{{ lookup('env', 'HOME') }}/.config/systemd/user/waybar.service.d/override.conf"
  register: waybar_dropin

- name: Reload systemd user daemon if drop-in changed
  become: false
  systemd:
    scope: user
    daemon_reload: true
  when: waybar_dropin.changed

- name: Enable and start waybar systemd user service
  become: false
  systemd:
    scope: user
    name: waybar.service
    enabled: true
    state: started
