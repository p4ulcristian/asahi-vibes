# Logitech MX Keys Mini (Bluetooth, 046d:b369) ONLY.
# In Windows mode this keyboard's bottom-left row is  Ctrl | Super | Alt | Space,
# i.e. Alt sits next to the spacebar and Super is one further out — the opposite
# of a Mac (Ctrl | Option | Cmd | Space). We swap them so the key next to space
# becomes the Cmd key (same `cmd` layer the built-in Apple keyboard uses), and
# the Super/Win key becomes Option/Alt. Everything else mirrors default.conf.
# The built-in keyboard is handled by default.conf (which excludes this id).

[ids]
046d:b369

[main]
capslock = f13
leftalt = layer(cmd)
leftmeta = layer(alt)
leftshift = layer(shift)
rightshift = layer(shift)

[cmd:M]
# App shortcuts -> Ctrl equivalents (override Meta passthrough for these keys)
a = C-a
c = C-c
v = C-v
x = C-x
z = C-z
s = C-s
f = C-f
w = C-w
t = C-t
y = C-y

# Font size / zoom (mac-style, override Meta passthrough) -> Ctrl +/-
minus = C-minus
equal = C-equal

# Text navigation (mac-style, override Meta passthrough)
left = home
right = end
up = C-home
down = C-end
backspace = C-backspace

# All other Cmd+key (Enter, 1-9, Space, D, J, etc.) pass through as Super+key -> Hyprland

[shift:M]

[cmd+shift]
s = M-S-s
