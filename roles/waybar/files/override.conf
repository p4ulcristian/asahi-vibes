[Unit]
# Rate-limit restarts so a hard-crash loop doesn't spin forever, but stay
# tolerant of transient SIGABRTs and manual reloads during theming.
StartLimitIntervalSec=120
StartLimitBurst=10

[Service]
# Waybar v0.15.0 crashes intermittently with SIGABRT (a module throwing).
# Always bring it back.
Restart=always
RestartSec=2
