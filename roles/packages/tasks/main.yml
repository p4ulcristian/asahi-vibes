---
- name: Install base packages
  become: true
  community.general.pacman:
    name:
      - zsh
      - git
      - github-cli
      - wireguard-tools
      - curl
      - wget
      - htop
      - neovim
      - chromium
      - powerline-fonts
      - grim
      - slurp
      - satty
      - wf-recorder
      - wl-clipboard
      - wtype
      - python-evdev
      - pipewire
      - libnotify
      - jq
      - wdisplays
      - base-devel
      - hyprlock
      - hypridle
      - thunar
      - polkit-gnome
      - ttf-jetbrains-mono-nerd
      - noto-fonts-emoji
      - otf-font-awesome
      - telegram-desktop
      - bluez
      - bluez-utils
      - blueman
      - upower
      - brightnessctl
      - calf
      - pipewire-zeroconf
      - avahi
      - nss-mdns
      - fuse2
      - moonlight-qt
      - kitty
    state: latest
    update_cache: true

- name: Enable and start bluetooth service
  become: true
  systemd:
    name: bluetooth.service
    enabled: true
    state: started

- name: Enable and start avahi (mDNS for AirPlay/HomePod discovery)
  become: true
  systemd:
    name: avahi-daemon.service
    enabled: true
    state: started

- name: Install AUR packages
  become: false
  shell: yay -S --noconfirm --needed {{ item }}
  loop:
    - git-cola
    - zsh-theme-powerlevel10k-git
  register: yay_result
  changed_when: "'nothing to do' not in yay_result.stdout"
