---
- name: Install base packages
  become: true
  community.general.pacman:
    name:
      - zsh
      - git
      - github-cli
      - wireguard-tools
      - curl
      - wget
      - htop
      - neovim
      - chromium
      - grim
      - slurp
      - satty
      - wf-recorder
      - wl-clipboard
      - wtype
      - python-evdev
      - pipewire
      - libnotify
      - jq
      - wdisplays
      - base-devel
      - hyprlock
      - hypridle
      - thunar
      # Thunar does no thumbnailing itself -- it hands every thumbnail request
      # to tumbler over D-Bus, and tumbler is only an *optional* dependency.
      # Without it Thunar silently shows generic MIME icons for everything,
      # which reads as "previews are broken" rather than "a package is
      # missing". The rest are tumbler's own optdeps: one per format family.
      - tumbler
      - ffmpegthumbnailer   # video
      - poppler-glib        # PDF
      - libgsf              # ODF
      - libgepub            # EPUB
      - libopenraw          # RAW photos
      - webp-pixbuf-loader  # webp (display as well as thumbnails)
      # GTK3 has no libadwaita-style recolouring mechanism, so caelestia paints
      # Thunar with a hand-written stylesheet (~/.config/gtk-3.0/thunar.css)
      # that assumes an adwaita-shaped base theme underneath. Stock GTK3
      # Adwaita is LIGHT unless told otherwise, which left dark caelestia
      # colours sitting on light widgets. adw-gtk-theme ships the
      # adw-gtk3-dark that the dconf key below actually names -- without it
      # /usr/share/themes is empty and the name silently falls back.
      - adw-gtk-theme
      # Likewise: the icon-theme key names Papirus-Dark, so it has to exist or
      # Thunar renders generic Adwaita fallback icons.
      - papirus-icon-theme
      - polkit-gnome
      - ttf-jetbrains-mono-nerd
      - noto-fonts-emoji
      - telegram-desktop
      - bluez
      - bluez-utils
      - blueman
      - upower
      - brightnessctl
      - calf
      - pipewire-zeroconf
      - avahi
      - nss-mdns
      - fuse2
      - moonlight-qt
      - kitty
      # Calculator + unit/currency converter. libqalculate (its backend) was
      # already here as a caelestia dependency and powers the launcher's
      # ">calc" mode; this adds the GUI frontend for a windowed converter.
      - qalculate-qt
    state: latest
    update_cache: true

- name: Enable and start bluetooth service
  become: true
  systemd:
    name: bluetooth.service
    enabled: true
    state: started

- name: Enable and start avahi (mDNS for AirPlay/HomePod discovery)
  become: true
  systemd:
    name: avahi-daemon.service
    enabled: true
    state: started

- name: Install AUR packages
  become: false
  shell: yay -S --noconfirm --needed {{ item }}
  loop:
    - git-cola
    - zsh-theme-powerlevel10k-git
    # VS Code cannot self-update on Linux -- its in-app updater only notifies.
    # Listing it here means a playbook run pulls the current AUR build, which
    # is why update.mode is "none" in the user settings: updates land on our
    # schedule instead of nagging. Restart VS Code after an upgrade.
    - visual-studio-code-bin
  register: yay_result
  changed_when: "'nothing to do' not in yay_result.stdout"
